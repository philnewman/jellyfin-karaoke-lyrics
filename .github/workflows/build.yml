name: Build Jellyfin plugin

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build plugin
        run: dotnet publish Jellyfin.Plugin.KaraokeLyrics/Jellyfin.Plugin.KaraokeLyrics.csproj --configuration Release --output publish
      - name: Assemble plugin package
        run: |
          python3 -m json.tool manifest.json >/dev/null
          mkdir -p package
          cp publish/Jellyfin.Plugin.KaraokeLyrics.dll package/
          cp plugin-meta.json package/meta.json
          cd package
          zip -q ../jellyfin-karaoke-lyrics-plugin.zip Jellyfin.Plugin.KaraokeLyrics.dll meta.json
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-karaoke-lyrics-plugin
          path: jellyfin-karaoke-lyrics-plugin.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jellyfin-karaoke-lyrics-plugin.zip

      - name: Add the release to the plugin repository manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/update_manifest.py "$GITHUB_REF_NAME" jellyfin-karaoke-lyrics-plugin.zip \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/jellyfin-karaoke-lyrics-plugin.zip" \
            "See https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add ${GITHUB_REF_NAME} to manifest.json"
          git push origin main
